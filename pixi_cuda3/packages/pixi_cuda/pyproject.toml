[project]
name = "pixi_cuda"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/pixi_cuda"]
artifacts = [
    "*.so",
]
exclude = [
    "__pycache__/",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "packages/",
    "test/",
]
exclude = [
    "__pycache__/",
]

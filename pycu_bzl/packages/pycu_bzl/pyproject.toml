[project]
name = "pycu_bzl"
version = "0.0.1"
description = ""
readme = "README.md"
authors = [{name = 'Chris Henn', email = 'chenn@alum.mit.edu'}]

requires-python = ">=3.13"
dependencies = [
    "more-itertools>=10.6.0",
    "numpy>=2.2.1",
    "pybind11>=2.13.6",
    "torch>=2.5.1",
]

[tool.uv]
cache-keys = [{file = "src/pycu_bzl/csrc/**/*"}]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "platform_system != 'Darwin'"}]
torchvision = [{ index = "pytorch-cu124", marker = "platform_system != 'Darwin'"}]

[build-system]
requires = ["hatchling", "hatch-build-scripts", "pybind11"]
build-backend = "hatchling.build"

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
out_dir = "src/pycu_bzl"
commands = [
    # "bazelisk build _C"
]
artifacts = [
    "_C*.so",
]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "test",
    "subprojects/",
    "*.bazel",
]
exclude = [
    "__pycache__/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pycu_bzl"]

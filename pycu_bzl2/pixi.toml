[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[feature.dev.dependencies]
pixi-pycharm = ">=0.0.9,<0.0.10"

[environments]
default = { features = ["dev"], solve-group = "main" }

[system-requirements]
cuda = "12"

[dependencies]
python = ">=3.13"
pytorch-gpu = ">=2.8.0,<3"
nanobind = ">=2.9.2,<3"

gcc = ">=14.3.0,<14.4"
clang = ">=21.1.2,<22"
cmake = ">=4.1.1,<5"
ninja = ">=1.13.1,<2"
bazel = ">=8.3.1,<9"

cuda = ">=12.9.1,<13"
cusparselt-dev = ">=0.8.1.1,<0.9"
libcusparse-dev = ">=12.5.10.65,<13"
libcudss-dev = ">=0.6.0.5,<0.7"
libstdcxx = ">=15.1.0,<16"

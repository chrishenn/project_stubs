[project]
name = "pycu_zig"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "more-itertools>=10.6.0",
    "numpy>=2.2.2",
    "torch>=2.6.0",
    # temporary issue: torch broke their wheels (including the nightly wheels), so
    #   uv pip install torch --index-url https://download.pytorch.org/whl/cu126
    # installs the necessary cuda runtime packages, but then
    #   uv sync
    # uninstalls them. So we have to manually add all these runtime cuda deps from pytorch
    "nvidia-cublas-cu12==12.6.4.1",
    "nvidia-cuda-cupti-cu12==12.6.80",
    "nvidia-cuda-nvrtc-cu12==12.6.77",
    "nvidia-cuda-runtime-cu12==12.6.77",
    "nvidia-cudnn-cu12==9.5.1.17",
    "nvidia-cufft-cu12==11.3.0.4",
    "nvidia-curand-cu12==10.3.7.77",
    "nvidia-cusolver-cu12==11.7.1.2",
    "nvidia-cusparse-cu12==12.5.4.2",
    "nvidia-cusparselt-cu12==0.6.3",
    "nvidia-nccl-cu12==2.21.5",
    "nvidia-nvjitlink-cu12==12.6.85",
    "nvidia-nvtx-cu12==12.6.77",
    "triton==3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]
nvidia-cuda-nvrtc-cu12 = [{ index = "pytorch" }]
nvidia-cuda-runtime-cu12 = [{ index = "pytorch" }]
nvidia-cuda-cupti-cu12 = [{ index = "pytorch" }]
nvidia-cudnn-cu12 = [{ index = "pytorch" }]
nvidia-cublas-cu12 = [{ index = "pytorch" }]
nvidia-cufft-cu12 = [{ index = "pytorch" }]
nvidia-curand-cu12 = [{ index = "pytorch" }]
nvidia-cusolver-cu12 = [{ index = "pytorch" }]
nvidia-cusparse-cu12 = [{ index = "pytorch" }]
nvidia-cusparselt-cu12 = [{ index = "pytorch" }]
nvidia-nccl-cu12 = [{ index = "pytorch" }]
nvidia-nvtx-cu12 = [{ index = "pytorch" }]
nvidia-nvjitlink-cu12 = [{ index = "pytorch" }]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
cache-keys = [{file = "csrc/*"}, {file = "build.zig"}, {file = "csrc/build.zig"}]

[tool.pytest.ini_options]

[build-system]
#requires = ["hatchling", "hatch-build-scripts", "ziggy-pydust==0.23.2"]
requires = ["hatchling", "hatch-build-scripts"]
build-backend = "hatchling.build"

#[tool.pydust]
#self_managed = true

[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
commands = [
#    "python build.py",
]
artifacts = [
#    "_C*.so",
]
out_dir = "src/pycu_zig"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "csrc",
    "test",
]
exclude = [
    "__pycache__/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pycu_zig"]

